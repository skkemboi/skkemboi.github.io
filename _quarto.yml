project:
  type: website
  output-dir: docs          # GitHub Pages: Settings → Pages → Deploy from branch → main /docs

website:
  title: "Stephen Kemboi"
  description: "Robust pricing, nonlinear affine processes, and derivatives under uncertainty."
  site-url: https://skkemboi.github.io
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: blog.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/skkemboi
      - icon: rss
        href: blog.xml
  page-footer:
    center: "© 2026 Stephen Kemboi · Department of Mathematics, University of Illinois Urbana-Champaign"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    echo: false
    html-math-method: katex
    fig-align: center

execute:
  freeze: auto              # plots are computed once and stored in _freeze/
  warning: false
